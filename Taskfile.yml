version: '3'

tasks:
  # ======== Environment ========
  sync:
    desc: Install dependencies using poetry
    cmds:
      - poetry install --no-root

  precommit:
    desc: Install git hooks via pre-commit
    deps: [sync]
    cmds:
      - poetry run pre-commit install

  init:
    desc: Full project setup — install deps and configure pre-commit
    deps: [sync, precommit]

  # ======== Commitizen ========
  cz-commit:
    desc: Create a commit using Commitizen (Conventional Commits standard)
    deps: [sync]
    cmds:
      - poetry run cz commit

  cz-check:
    desc: Check if commit messages follow Conventional Commits
    deps: [sync]
    cmds:
      - poetry run cz check

  cz-bump:
    desc: Bump version, tag, and update changelog using Commitizen
    deps: [sync]
    cmds:
      - poetry run cz bump

  release:
    desc: Bump version and push tags (run after merge to main)
    deps: [sync]
    cmds:
      - poetry run cz bump
      - git push --follow-tags

  # ======== Formatting ========
  fmt:
    desc: Auto-fix lint issues and format code
    deps: [sync]
    cmds:
      - poetry run ruff format .
      - poetry run ruff check . --fix --unsafe-fixes

  # ======== Static analysis ========
  lint:
    desc: Run Ruff and MyPy
    deps: [sync]
    cmds:
      - poetry run ruff check .
      - poetry run ruff format --check .
      - poetry run mypy .

  # ======== Dependency hygiene ========
  audit:
    desc: Security audit
    deps: [sync]
    cmds:
      - poetry run pip-audit --ignore-vuln PYSEC-2022-42969

  unused-libs:
    desc: Detect unused dependencies
    deps: [sync]
    cmds:
      - poetry run deptry .

  # ======== Full quality gate ========
  check:
    desc: Run full quality checks
    deps: [lint, audit, unused-libs]

  # ======== Run app ========
  run:
    desc: Run the application
    cmds:
      - poetry run streamlit run streamlit_app.py

  # ======== Docker ========
  docker-build:
    desc: Build the application in docker
    cmds:
      - docker build -t quick-system .

  docker-run:
    desc: Run the application in docker
    platforms: [linux, darwin]
    cmds:
      - docker run -it --rm -p 8501:8501
          -v $(pwd)/cache:/app/cache
          quick-system

  docker:
    desc: Start the application in docker
    deps: [docker-build, docker-run]
