version: '3'

tasks:
  # ======== Environment ========
  sync:
    desc: Sync all dependency groups using uv
    cmds:
      - uv sync --all-groups

  sync-frozen:
    desc: Sync all dependency groups from the lockfile
    cmds:
      - uv sync --frozen --all-groups

  precommit:
    desc: Install git hooks
    cmds:
      - uv run pre-commit install --install-hooks

  precommit-run:
    desc: Run pre-commit on all files
    cmds:
      - uv run pre-commit run --all-files

  init:
    desc: Full project setup
    cmds:
      - task: sync
      - task: precommit

  # ======== Commitizen ========
  cz-commit:
    desc: Commit using Conventional Commits
    cmds:
      - uv run cz commit

  cz-check:
    desc: Check commit messages
    cmds:
      - uv run cz check

  cz-bump:
    desc: Bump version and update changelog
    cmds:
      - uv run cz bump

  release:
    desc: Bump version and push tags
    cmds:
      - task: cz-bump
      - git push --follow-tags

  # ======== Formatting ========
  fmt:
    desc: Auto-fix lint issues and format code
    cmds:
      - uv run ruff format .
      - uv run ruff check . --fix

  fmt-unsafe:
    desc: Auto-fix lint issues using unsafe fixes and format code
    cmds:
      - uv run ruff format .
      - uv run ruff check . --fix --unsafe-fixes

  # ======== Static analysis ========
  lint:
    desc: Run all static checks
    cmds:
      - task: ruff
      - task: fmt-check
      - task: typecheck

  ruff:
    desc: Run Ruff lint
    cmds:
      - uv run ruff check .

  fmt-check:
    desc: Check formatting
    cmds:
      - uv run ruff format --check .

  typecheck:
    desc: Run MyPy
    cmds:
      - uv run mypy .

  test:
    desc: Run unit and scientific validation tests
    cmds:
      - uv run pytest

  test-cov:
    desc: Run tests with branch coverage
    cmds:
      - uv run pytest --cov --cov-report=term-missing --cov-report=xml

  build:
    desc: Build wheel and source distribution
    cmds:
      - uv build

  ci:
    desc: Run the local CI quality gate
    cmds:
      - task: lint
      - task: test-cov
      - task: build

  ci-frozen:
    desc: Run CI using locked dependencies
    cmds:
      - task: sync-frozen
      - task: ci

  # ======== Dependency hygiene ========
  audit:
    desc: Security audit
    cmds:
      - uv run pip-audit --ignore-vuln PYSEC-2022-42969

  unused-libs:
    desc: Detect unused dependencies
    cmds:
      - uv run deptry . --config pyproject.toml

  # ======== Full quality gate ========
  check:
    desc: Run full quality checks
    cmds:
      - task: lint
      - task: test-cov
      - task: build
      - task: audit
      - task: unused-libs

  # ======== Run app ========
  run:
    desc: Run the application
    cmds:
      - uv run streamlit run web/app.py

  run-api:
    desc: Run the FastAPI backend
    cmds:
      - uv run uvicorn api.main:app --host 0.0.0.0 --port 8000

  # ======== Docker ========
  docker-build:
    desc: Build Docker image
    cmds:
      - docker build -t quick-system .

  docker-run:
    desc: Run Docker container
    cmds:
      - docker run -it --rm -p 8501:8501
          -v $(pwd)/cache:/app/cache
          quick-system

  docker:
    desc: Build and run Docker
    cmds:
      - task: docker-build
      - task: docker-run
