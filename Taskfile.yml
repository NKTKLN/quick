version: '3'

tasks:
  # ======== Environment ========
  sync:
    desc: Sync dependencies using uv
    cmds:
      - uv sync --group dev --group web

  precommit:
    desc: Install git hooks
    cmds:
      - uv run pre-commit install

  init:
    desc: Full project setup
    cmds:
      - task: sync
      - task: precommit

  # ======== Commitizen ========
  cz-commit:
    desc: Commit using Conventional Commits
    cmds:
      - uv run cz commit

  cz-check:
    desc: Check commit messages
    cmds:
      - uv run cz check

  cz-bump:
    desc: Bump version and update changelog
    cmds:
      - uv run cz bump

  release:
    desc: Bump version and push tags
    cmds:
      - task: cz-bump
      - git push --follow-tags

  # ======== Formatting ========
  fmt:
    desc: Auto-fix lint issues and format code
    cmds:
      - uv run ruff format .
      - uv run ruff check . --fix --unsafe-fixes

  # ======== Static analysis ========
  lint:
    desc: Run Ruff and MyPy
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run mypy .

  # ======== Dependency hygiene ========
  audit:
    desc: Security audit
    cmds:
      - uv run pip-audit --ignore-vuln PYSEC-2022-42969

  unused-libs:
    desc: Detect unused dependencies
    cmds:
      - uv run deptry . --config pyproject.toml

  # ======== Full quality gate ========
  check:
    desc: Run full quality checks
    cmds: 
      - task: lint
      - task: audit
      - task: unused-libs

  # ======== Run app ========
  run:
    desc: Run the application
    cmds:
      - uv run streamlit run web/app.py

  # ======== Docker ========
  docker-build:
    desc: Build Docker image
    cmds:
      - docker build -t quick-system .

  docker-run:
    desc: Run Docker container
    cmds:
      - docker run -it --rm -p 8501:8501
          -v $(pwd)/cache:/app/cache
          quick-system

  docker:
    desc: Build and run Docker
    cmds:
      - task: docker-build
      - task: docker-run
