[project]
name = "quick"
version = "2.0.0"
description = ""
authors = [
    {name = "NKTKLN",email = "nktkln@nktkln.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "numpy (>=2.2.4,<3.0.0)",
    "scipy (>=1.15.3,<2.0.0)",
    "mpmath (>=1.3.0,<2.0.0)",
    "duckdb (>=1.3.0,<2.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
]

[dependency-groups]
dev = [
  "ruff>=0.15.1",
  "mypy>=1.19.1",
  "pre-commit>=4.5.1",
  "pip-audit>=2.10.0",
  "deptry>=0.24.0",
  "commitizen>=4.13.7",
  "scipy-stubs (>=1.15.3.0,<2.0.0.0)",
  "pandas-stubs (>=2.2.3.250527,<3.0.0.0)",
]

web = [
  "streamlit>=1.44.1,<2.0.0",
  "watchdog>=6.0.0,<7.0.0",
  "plotly (>=6.1.2,<7.0.0)",
  "pandas>=2.3.3",
]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quick"]

[tool.hatch.build.targets.sdist]
include = ["src/quick", "README.md", "pyproject.toml"]

[tool.hatch.build]
exclude = [
  "/.github",
  "/.venv",
  "/tmp",
  "/dist",
  "/build",
  "**/__pycache__",
  "**/*.pyc",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-include = ["*.ipynb"]
exclude = [".git", "__pycache__", "build", "dist", ".venv", "tmp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "B", "B9", "C90", "S", "UP", "SIM", "ARG", "PTH"]
ignore = ["E203", "D100", "E501", "ARG004"]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101", "D", "PLR2004"]  # assert, docstrings, magic values in tests
"**/*.ipynb" = ["T201"]                   # print

[tool.mypy]
mypy_path = ["src/quick"]
files = ["src"]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
pretty = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
strict_optional = true
disallow_untyped_calls = true
exclude = [".git", "__pycache__", "build", "dist", ".venv", "tmp", "web"]

[tool.deptry]
non_dev_dependency_groups = ["web"]
experimental_namespace_package = true

[tool.deptry.per_rule_ignores]
DEP001 = ["pages"]
DEP002 = ["watchdog"]
DEP003 = ["quick"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
