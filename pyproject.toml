[project]
name = "quick"
version = "0.1.0"
description = ""
authors = [
    {name = "NKTKLN",email = "nktkln@nktkln.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "numpy (>=2.2.4,<3.0.0)",
    "logger (>=1.4,<2.0)",
    "streamlit (>=1.44.1,<2.0.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "scipy (>=1.15.3,<2.0.0)",
    "mpmath (>=1.3.0,<2.0.0)",
    "duckdb (>=1.3.0,<2.0.0)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
    "pandas-stubs (>=2.2.3.250527,<3.0.0.0)",
    "scipy-stubs (>=1.15.3.0,<2.0.0.0)",
    "plotly (>=6.1.2,<7.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "nbformat (>=5.10.4,<6.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.6"
mypy = "^1.15.0"
pre-commit = "^4.2.0"
pip-audit = "^2.9.0"
pyupgrade-directories = "^0.3.0"
commitizen = "^4.8.3"
deptry = "^0.24.0"

[tool.ruff]
line-length = 88
target-version = "py313"
extend-include = ["*.ipynb"]
exclude = [".git", "__pycache__", "build", "dist", ".venv", "tmp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "B", "B9", "C90", "S", "UP", "SIM", "ARG", "PTH"]
ignore = ["E203", "D100", "E501", "ARG004"]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["S101", "D", "PLR2004"]  # assert, docstrings, magic values in tests
"**/*.ipynb" = ["T201"]                   # print

[tool.mypy]
mypy_path = ["src"]
files = ["src", "tests"]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
pretty = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
strict_optional = true
disallow_untyped_calls = true
exclude = [".git", "__pycache__", "build", "dist", ".venv", "tmp"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "poetry"
update_changelog_on_bump = true
major_version_zero = true
